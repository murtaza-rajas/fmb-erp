# Serves the React SPA's static build output and reverse-proxies /api and
# /socket.io to the backend container — one public-facing server for both,
# baked into the frontend image (see docker/frontend.Dockerfile).
server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass http://backend:5000/health;
    }

    # React Router client-side routes have no matching file on disk — fall
    # through to index.html so a hard refresh on e.g. /procurement/purchase-orders
    # doesn't 404. Longest-prefix matching means this catch-all never shadows
    # the more specific locations above regardless of file order, but it's
    # kept last for readability.
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
