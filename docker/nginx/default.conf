# Serves the React SPA's static build output and reverse-proxies /erp/api
# and /erp/socket.io to the backend container — one public-facing server for
# both, baked into the frontend image (see docker/frontend.Dockerfile).
#
# Everything lives under the /erp/ prefix because this app is reverse-proxied
# by an upstream Apache at nagpurjamaat.org/erp alongside other unrelated
# sites on that same domain/root — it does not own the domain root itself.
# The frontend is built with VITE_BASE_PATH=/erp/ so the SPA's own asset and
# router paths already expect this prefix (see docker/frontend.Dockerfile).
server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    # Trailing slash on both sides strips the /erp/api/ prefix before
    # forwarding, so this lands on the backend's own apiBasePath (/api/v1/...).
    location /erp/api/ {
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /erp/socket.io/ {
        proxy_pass http://backend:5000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location /erp/health {
        proxy_pass http://backend:5000/health;
    }

    # React Router client-side routes have no matching file on disk — fall
    # through to index.html so a hard refresh on e.g.
    # /erp/procurement/purchase-orders doesn't 404. Longest-prefix matching
    # means this catch-all never shadows the more specific locations above
    # regardless of file order, but it's kept last for readability. `alias`
    # (not `root`) because the URL prefix /erp/ doesn't exist on disk — the
    # build output sits directly in the html root.
    location /erp/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /erp/index.html;
    }
}
