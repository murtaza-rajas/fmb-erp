services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: initializes the single-node replica set MongoDB transactions
  # require (see backend PO/GRN/Payment services — all use sessions).
  mongo-init:
    image: mongo:8
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      mongosh --host mongo --eval "
        try { rs.status(); } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}); }
      "

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    env_file:
      - ../backend/.env
    environment:
      MONGO_URI: mongodb://mongo:27017/fmb_erp?replicaSet=rs0
      REDIS_URL: redis://redis:6379
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - backend-logs:/app/logs

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
      # Deployed at nagpurjamaat.org/erp (Apache reverse-proxies that path
      # here, prefix preserved) rather than owning a domain root, since this
      # server already hosts other unrelated sites on that domain.
      args:
        VITE_BASE_PATH: /erp/
        VITE_API_BASE_URL: /erp/api/v1
        VITE_SOCKET_URL: ""
        VITE_SOCKET_PATH: /erp/socket.io
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8088:80"

volumes:
  mongo-data:
  redis-data:
  backend-logs:
